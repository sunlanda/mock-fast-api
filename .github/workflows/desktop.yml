name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "app/**"
      - "web/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "app/**"
      - "web/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Package and smoke test
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify Electron toolchain
        shell: pwsh
        working-directory: desktop
        run: |
          node --version
          npm --version
          if (-not (Test-Path "node_modules\electron-builder")) {
            throw "electron-builder is missing after npm ci"
          }
          if (-not (Test-Path "node_modules\electron\dist\electron.exe")) {
            Write-Host "Electron binary missing; running install.js with mirror"
            node "node_modules\electron\install.js"
            if ($LASTEXITCODE -ne 0) {
              "## Electron binary install failed (exit $LASTEXITCODE)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              throw "Electron install.js failed"
            }
          }
          if (-not (Test-Path "node_modules\electron\dist\electron.exe")) {
            throw "Electron binary is missing after install.js"
          }

      - name: Build bundled backend
        working-directory: desktop
        run: npm run build:backend

      - name: Package Electron app
        shell: pwsh
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          & npm run pack 2>&1 | Tee-Object -FilePath pack.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "## Electron packaging failed" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content pack.log -Tail 120 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $code
          }

      - name: Smoke test packaged desktop app
        shell: pwsh
        working-directory: desktop
        run: |
          & ".\scripts\smoke-test.ps1"
