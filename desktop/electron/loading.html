<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MockFast · 正在启动</title>
  <style>
    :root { color-scheme: dark; --bg:#070b10; --panel:#0f1721; --line:#1e2d3b; --text:#e9f3f5; --muted:#8ba3b0; --mint:#46e0a4; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background:
        radial-gradient(900px 500px at 75% -10%, rgba(70,224,164,.12), transparent 60%),
        radial-gradient(700px 420px at 10% 10%, rgba(102,170,255,.08), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      display: grid;
      place-items: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(480px, calc(100vw - 48px));
      padding: 38px 34px 30px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      text-align: center;
    }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 18px; display: block;
      filter: drop-shadow(0 0 22px rgba(70,224,164,.22));
    }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.03em; font-weight: 650; }
    .tag { margin: 8px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .bar {
      height: 4px; margin: 28px auto 14px; width: 100%; border-radius: 99px;
      background: #172430; overflow: hidden; position: relative;
    }
    .bar::after {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 38%;
      border-radius: inherit; background: linear-gradient(90deg, transparent, var(--mint), transparent);
      animation: sweep 1.25s ease-in-out infinite;
    }
    .hint { margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.7; }
    .meta { margin-top: 24px; padding-top: 15px; border-top: 1px solid var(--line); color: #5f7785; font-family: Consolas, monospace; font-size: 9px; letter-spacing: .06em; }
    @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../build/icon.png" alt="MockFast" />
    <h1>MockFast</h1>
    <p class="tag">正在启动本地 API Mock 服务…</p>
    <div class="bar" aria-hidden="true"></div>
    <p class="hint">首次启动会初始化演示数据库，可能需要几秒钟。<br />数据仅保存在本机。</p>
    <div class="meta">DESKTOP · LOCALHOST ONLY</div>
  </main>
</body>
</html>
