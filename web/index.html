<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0f15" />
  <meta name="description" content="MockFast — 为前端开发准备的本地优先 API Mock 工作室，支持 SQLite / PostgreSQL / MySQL / MongoDB。" />
  <title>MockFast · API Mock Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <aside class="rail" id="rail">
    <a class="brand" href="#/workbench" aria-label="MockFast 工作台">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="none" stroke="currentColor" stroke-opacity=".25"/>
          <path d="M9 22V11l7 5.2L23 11v11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="24.4" r="1.6" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>MockFast</strong>
        <small>API MOCK STUDIO</small>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="主导航">
      <button class="nav-item" data-view="workbench">
        <span class="nav-ico" data-icon="grid"></span>
        <span class="nav-label">工作台</span>
        <span class="nav-hint">MOCK</span>
      </button>
      <button class="nav-item" data-view="schema">
        <span class="nav-ico" data-icon="database"></span>
        <span class="nav-label">数据浏览器</span>
      </button>
      <button class="nav-item" data-view="sql">
        <span class="nav-ico" data-icon="terminal"></span>
        <span class="nav-label">SQL 控制台</span>
      </button>
      <button class="nav-item" data-view="logs">
        <span class="nav-ico" data-icon="activity"></span>
        <span class="nav-label">调用日志</span>
        <span class="live-dot" title="实时记录"></span>
      </button>
    </nav>

    <div class="rail-bottom">
      <button class="nav-item" data-view="settings">
        <span class="nav-ico" data-icon="sliders"></span>
        <span class="nav-label">设置</span>
      </button>
      <button class="theme-toggle" id="theme-toggle" type="button" title="切换明暗主题">
        <span class="theme-ico" data-icon="moon"></span>
        <span class="theme-label">深色</span>
      </button>
      <div class="rail-version">
        <span>v0.0.2</span>
        <span class="version-pill">LOCAL</span>
      </div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-menu" id="mobile-menu" type="button" aria-label="打开导航">
          <span data-icon="menu"></span>
        </button>
        <div class="crumb">
          <span>MOCKFAST</span>
          <i>/</i>
          <strong id="view-title">工作台</strong>
        </div>
        <p class="view-subtitle" id="view-subtitle">从 PRD 到可调用的接口，只差一张模板卡片。</p>
      </div>
      <div class="topbar-right">
        <span class="local-pill" id="local-pill"><span class="dot"></span><span id="local-label">LOCAL</span></span>
        <div class="conn-switch">
          <button class="conn-trigger" id="conn-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
            <span class="conn-ico" data-icon="database"></span>
            <span class="conn-meta">
              <small>当前数据源</small>
              <b id="conn-label">加载中…</b>
            </span>
            <span class="chev" data-icon="chevron-down"></span>
          </button>
          <div class="conn-menu" id="conn-menu" hidden></div>
        </div>
        <a class="icon-btn" href="/api/docs" target="_blank" rel="noreferrer" title="OpenAPI 文档">
          <span data-icon="book"></span>
        </a>
      </div>
    </header>

    <main class="view-root" id="view-root" tabindex="-1">
      <div class="boot-screen">
        <div class="boot-mark"><span data-icon="layers"></span></div>
        <p>正在唤醒 MockFast…</p>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript>
    <div class="noscript">MockFast 需要启用 JavaScript。</div>
  </noscript>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
